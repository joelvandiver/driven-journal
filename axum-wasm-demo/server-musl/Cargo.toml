[package]
name = "server-musl"
version = "0.1.0"
edition = "2021"
description = "Native Axum server, built as a fully static x86_64-unknown-linux-musl binary."

[dependencies]
api-core = { path = "../api-core" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
